name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run toolkit and fixture tests
        run: npm test
      - name: Reference lessons must verify against their fixtures
        run: node skills/i-didnt-write-this/assets/toolkit.mjs verify tests/fixtures/cart-lesson.json --repo fixtures/cart && node skills/i-didnt-write-this/assets/toolkit.mjs verify tests/fixtures/limiter-lesson.json --repo fixtures/limiter

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run the browser test suite
        run: npm run test:e2e
